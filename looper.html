<!DOCTYPE html>
<html lang="en">
  <head>
    <title>YouTube Looper</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" /> <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔁</text></svg>">

    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
<style>
  :root {
    --bg: #111;
    --surface: #1c1c1c;
    --border: #2e2e2e;
    --text: #ccc;
    --text-dim: #666;
    --accent: #5c6bc0;
    --accent-hover: #7986cb;
    --input-bg: #222;
  }

  [data-theme="light"] {
    --bg: #f4f4f4;
    --surface: #fff;
    --border: #ddd;
    --text: #222;
    --text-dim: #999;
    --accent: #3f51b5;
    --accent-hover: #5c6bc0;
    --input-bg: #fff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    font-size: 13px;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    gap: 20px;
  }

  header {
    width: 100%;
    max-width: 860px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
    opacity: 0.5;
  }

  #dark-mode-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: border-color 0.2s, color 0.2s;
  }
  #dark-mode-toggle:hover { border-color: var(--accent); color: var(--text); }

  .url-bar {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 560px;
  }

  .url-bar input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .url-bar input:focus { border-color: var(--accent); }

  .url-bar button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.2s;
  }
  .url-bar button:hover { background: var(--accent-hover); }

  #iframe-wrapper {
    line-height: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .controls-wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  input[type="text"], select {
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, select:focus { border-color: var(--accent); }
  select { cursor: pointer; }

  #set-loop {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    align-self: flex-end;
    transition: background 0.2s;
    white-space: nowrap;
  }
  #set-loop:hover { background: var(--accent-hover); }

  .table-section {
    width: 100%;
    max-width: 860px;
  }

  .table-section h2 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface); }

  tbody td {
    padding: 2px 4px;
  }

  tbody td[contenteditable] {
    padding: 7px 10px;
    outline: none;
    color: var(--text);
    min-width: 60px;
    border-radius: 4px;
  }
  tbody td[contenteditable]:focus {
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  tbody td[contenteditable].url-cell { min-width: 220px; color: var(--text-dim); }
  tbody td[contenteditable].url-cell:focus { color: var(--text); }

  .play-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .play-btn:hover { color: #81c995; background: rgba(129,201,149,0.08); }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .delete-btn:hover { color: #e57373; background: rgba(229,115,115,0.08); }

  #add-row-btn {
    margin-top: 10px;
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    width: 100%;
    transition: border-color 0.2s, color 0.2s;
  }
  #add-row-btn:hover { border-color: var(--accent); color: var(--text); }
</style>
  <body>
    <header>
      <h1>YouTube Looper</h1>
      <button id="dark-mode-toggle">Light mode</button>
    </header>

    <div class="url-bar">
      <input type="text" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="change-url-button">Load</button>
    </div>

    <div id="iframe-wrapper">
      <iframe
        id="youtube-video"
        width="560"
        height="315"
        frameborder="0"
      ></iframe>
    </div>

    <div class="controls-wrapper">
      <div class="control-group">
        <label for="start-time">Start (h:m:s)</label>
        <input type="text" id="start-time" placeholder="0:00" style="width:90px" />
      </div>
      <div class="control-group">
        <label for="end-time">End (h:m:s)</label>
        <input type="text" id="end-time" placeholder="0:30" style="width:90px" />
      </div>
      <button id="set-loop">Set Loop</button>
      <div class="control-group">
        <label for="speed-control">Speed</label>
        <select id="speed-control">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
      <div class="control-group">
        <label for="player-size">Size</label>
        <select id="player-size">
          <option value="560x315" selected>Normal</option>
          <option value="854x480">Wide</option>
          <option value="1280x720">Full</option>
        </select>
      </div>
    </div>

    <div class="table-section">
      <h2>Saved Loops</h2>
      <table id="loops-table">
        <thead>
          <tr>
            <th>URL</th>
            <th>Start</th>
            <th>End</th>
            <th>Notes</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="loops-tbody">
          <tr>
            <td contenteditable="true" class="url-cell">https://www.youtube.com/watch?v=iZLyMbwtQJs</td>
            <td contenteditable="true">0:55</td>
            <td contenteditable="true">1:32</td>
            <td contenteditable="true">KB full body exercise</td>
            <td><button class="play-btn" onclick="playRow(this)">▶</button></td>
            <td><button class="delete-btn" onclick="deleteRow(this)">×</button></td>
          </tr>
        </tbody>
      </table>
      <button id="add-row-btn">+ Add row</button>
    </div>

    <script>
      let player;
      let loopStart = 0;
      let loopEnd = 0;
      let isLooping = false;
      let darkMode = true;
      let loopInterval = null;

      document.getElementById('youtube-video').src =
        `https://www.youtube.com/embed/iZLyMbwtQJs?enablejsapi=1&origin=${window.location.origin}`;

      function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-video', {
          events: {
            onStateChange: onPlayerStateChange,
          },
        });
      }


      function onPlayerStateChange(event) {
        if (isLooping && event.data === YT.PlayerState.ENDED) {
          player.seekTo(loopStart);
          player.playVideo();
        }

        clearInterval(loopInterval);
        if (isLooping && event.data === YT.PlayerState.PLAYING) {
          loopInterval = setInterval(() => {
            if (player.getCurrentTime() >= loopEnd) {
              player.seekTo(loopStart);
            }
          }, 100);
        }
      }

      function toSeconds(timeString) {
        let seconds = 0;
        timeString.split(':').reverse().forEach((s, i) => seconds += +s * 60**i);
        return seconds;
      }

      function getPlayerIframe() {
        return player ? player.getIframe() : document.getElementById('youtube-video');
      }

      function toggleDarkMode() {
        darkMode = !darkMode;
        document.documentElement.setAttribute('data-theme', darkMode ? '' : 'light');
        document.getElementById('dark-mode-toggle').textContent = darkMode ? 'Light mode' : 'Dark mode';
      }

      document.getElementById('set-loop').addEventListener('click', function () {
        loopStart = toSeconds(document.getElementById('start-time').value);
        loopEnd = toSeconds(document.getElementById('end-time').value);
        if (loopStart >= 0 && loopEnd > loopStart) {
          isLooping = true;
          player.seekTo(loopStart);
          player.playVideo();
        }
      });

      document.getElementById('speed-control').addEventListener('change', function () {
        const speed = parseFloat(this.value);
        if (player && player.setPlaybackRate) {
          player.setPlaybackRate(speed);
        }
      });

      document.getElementById('player-size').addEventListener('change', function () {
        const [w, h] = this.value.split('x');
        const iframe = getPlayerIframe();
        iframe.setAttribute('width', w);
        iframe.setAttribute('height', h);
      });

      document.getElementById('dark-mode-toggle').addEventListener('click', function () {
        toggleDarkMode();
      });

      function playRow(btn) {
        const cells = btn.closest('tr').querySelectorAll('td[contenteditable]');
        const url = cells[0].textContent.trim();
        const start = cells[1].textContent.trim();
        const end = cells[2].textContent.trim();

        const videoId = url.split("=")[1];
        if (!videoId) return;

        // Update the URL input fields to reflect what's loaded
        document.getElementById('youtube-url').value = url;
        document.getElementById('start-time').value = start;
        document.getElementById('end-time').value = end;

        // Swap the iframe
        const existingIframe = getPlayerIframe();
        existingIframe.parentNode.removeChild(existingIframe);

        const sizeVal = document.getElementById('player-size').value;
        const [w, h] = sizeVal.split('x');
        const iframeWrapper = document.getElementById('iframe-wrapper');
        const iframe = document.createElement('iframe');
        iframe.setAttribute('id', 'youtube-video');
        iframe.setAttribute('src', `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${window.location.origin}`);
        iframe.setAttribute('width', w);
        iframe.setAttribute('height', h);
        iframe.setAttribute('frameborder', '0');
        iframeWrapper.appendChild(iframe);

        isLooping = false;
        clearInterval(loopInterval);
        player = null;

        // Wait for the player to be ready, then start the loop
        const origReady = window.onYouTubeIframeAPIReady;
        player = new YT.Player('youtube-video', {
          events: {
            onReady: function () {
              loopStart = toSeconds(start);
              loopEnd = toSeconds(end);
              if (loopStart >= 0 && loopEnd > loopStart) {
                isLooping = true;
                player.seekTo(loopStart);
                player.playVideo();
              }
            },
            onStateChange: onPlayerStateChange,
          },
        });

        // Scroll player into view
        document.getElementById('iframe-wrapper').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function deleteRow(btn) {
        btn.closest('tr').remove();
      }

      document.getElementById('add-row-btn').addEventListener('click', function () {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td contenteditable="true" class="url-cell"></td>
          <td contenteditable="true"></td>
          <td contenteditable="true"></td>
          <td contenteditable="true"></td>
          <td><button class="play-btn" onclick="playRow(this)">▶</button></td>
          <td><button class="delete-btn" onclick="deleteRow(this)">×</button></td>
        `;
        document.getElementById('loops-tbody').appendChild(tr);
        tr.querySelector('.url-cell').focus();
      });

      document.getElementById('change-url-button').addEventListener('click', function () {
        const existingIframe = getPlayerIframe();
        existingIframe.parentNode.removeChild(existingIframe);

        const rawUrl = document.getElementById('youtube-url').value;
        const videoId = rawUrl.split("=")[1];
        const sizeVal = document.getElementById('player-size').value;
        const [w, h] = sizeVal.split('x');

        const iframeWrapper = document.getElementById('iframe-wrapper');
        const iframe = document.createElement("iframe");
        iframe.setAttribute("id", "youtube-video");
        iframe.setAttribute("src", `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${window.location.origin}`);
        iframe.setAttribute("width", w);
        iframe.setAttribute("height", h);
        iframe.setAttribute("frameborder", "0");
        iframeWrapper.appendChild(iframe);

        isLooping = false;
        clearInterval(loopInterval);
        player = null;
        onYouTubeIframeAPIReady();
      });
    </script>
  </body>
</html>
